<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Noel Illinger — useful software, thoughtful interactions</title>
  <desc id="desc">A navy and ice-blue editorial banner with connected geometric shapes.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101e30"/>
      <stop offset="1" stop-color="#163449"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="1">
      <stop stop-color="#b8e5f2"/>
      <stop offset="1" stop-color="#5ab6d8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#background)"/>
  <path d="M64 62h40" stroke="#5ab6d8" stroke-width="4" stroke-linecap="round"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="120" y="70" font-size="23" font-weight="500" letter-spacing="2" fill="#b8d5e4">NOEL ILLINGER</text>
    <text x="64" y="155" font-size="51" font-weight="650" letter-spacing="-1.5" fill="#f1f7fb">Useful software.</text>
    <text x="64" y="216" font-size="51" font-weight="650" letter-spacing="-1.5" fill="#f1f7fb">Thoughtful interactions.</text>
    <text x="66" y="270" font-size="20" fill="#a7c5d6">NATIVE APPS  /  WEB TOOLS  /  AI WORKFLOWS</text>
  </g>
  <g fill="none" stroke="#5ab6d8">
    <path d="M865 104h170v110H925v-55h-60z" stroke-width="1.5" opacity=".4"/>
    <rect x="808" y="70" width="114" height="114" rx="29" stroke-width="1.5" opacity=".65" transform="rotate(-10 865 127)"/>
    <rect x="984" y="158" width="91" height="91" rx="23" stroke-width="1.5" opacity=".65" transform="rotate(10 1029 203)"/>
    <circle cx="1052" cy="82" r="34" stroke-width="1.5" opacity=".45"/>
  </g>
  <circle cx="865" cy="127" r="22" fill="url(#accent)"/>
  <circle cx="1029" cy="203" r="14" fill="url(#accent)"/>
  <circle cx="1052" cy="82" r="5" fill="#b8e5f2"/>
